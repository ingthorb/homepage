        <p class="role">Senior Software Engineer at NOVA Iceland</p>
        <h1>Ingþór Birkir Árnason</h1>
        <p>I work on telecom products at NOVA, like eSIM signup and travel connectivity. I also build my own apps.</p>
        <p>Reykjavík, Iceland. Telecom at NOVA. My own projects after that.</p>

        <section>
          <h2>What I’ve shipped.</h2>
          <p>Client websites, apps I wanted myself, and some earlier work.</p>

          <h3>DeckMate</h3>
          <p>Personal project · Web, iOS &amp; Android</p>
          <p>Turn your trip crew into a deck of trading cards. Create invite-only trips, give friends cards with photos and playful stats, and draw a person or challenge whenever the group needs a spark. Keep the stories and photos together in private trip moments.</p>
          <p><a href="https://www.deckmate.io/">Explore DeckMate</a></p>

          <h3>PadelHub</h3>
          <p>Personal project · Sports &amp; community</p>
          <p>A home for padel players in Iceland to organize games, record scores, and compete with friends. Run Americano and Mexicano tournaments with automatic pairings, rounds, and standings, or create private groups for recurring sessions and season competition. Available in Icelandic and English.</p>
          <p><a href="https://padelhub.is/">Explore PadelHub</a></p>

          <h3>ChessAITutor</h3>
          <p>Personal project · Interactive learning</p>
          <p>Learn chess by playing. Challenge AI opponents at Amateur, Intermediate, and Experienced levels, then explore interactive lessons on moves, tactics, openings, and endgames. Chess puzzles and practical guidance make it easy to move from reading about a concept to trying it on the board.</p>
          <p><a href="https://chessaitutor.net/">Explore ChessAITutor</a></p>

          <h3>Bilabud.is</h3>
          <p>Website project · E-commerce</p>
          <p>An Icelandic online store for remote-controlled cars and construction vehicles. Shoppers can browse off-road vehicles, drift cars, and model machinery, explore special offers, and check prices and stock availability before adding products to their basket.</p>
          <p><a href="https://bilabud.is/">Explore Bilabud.is</a></p>

          <h3>Gluggasalan.is</h3>
          <p>Client website · February – June 2025</p>
          <p>Created a website for a window supplier in Selfoss, Iceland. The site presents window and sliding-door ranges, installation services, and showroom contact information to help customers explore their options.</p>
          <p><a href="https://www.gluggasalan.is/">Explore Gluggasalan.is</a></p>

          <h3>Travelade</h3>
          <p>Professional work · Travel</p>
          <p>A travel discovery platform built around local recommendations. As an early frontend developer, I contributed React and Redux features, product ideas, and SEO improvements.</p>
          <p><a href="https://www.travelade.com/">Explore Travelade</a></p>
        </section>

        <section>
          <h2>Reykjavík, then Switzerland, then home.</h2>
          <p>I’m a software engineer in Reykjavík. I got into this because I like making things, and I still do that when I’m not at work.</p>
          <p>At NOVA I work on customer-facing telecom products, including mobile eSIM signup and travel connectivity. Before that I was at Swisscom in Switzerland, building self-service data platforms and acting as my team’s Security Champion. DeckMate, PadelHub, and ChessAITutor are projects I started myself.</p>
          <p>I stay with a feature from the UI to the backend and the deploy pipeline. Away from the screen: football, time outside, and padel.</p>
          <p><a href="https://www.linkedin.com/in/ingthorb">More on LinkedIn</a></p>
        </section>

        <section>
          <h2>Jobs I’ve had.</h2>
          <p>Iceland and Switzerland. From a student job to telecom.</p>

          <h3>NOVA Iceland</h3>
          <p>Senior Software Engineer · October 2024 – Present</p>
          <p>Built the mobile eSIM self-service signup flow and worked on the Travel eSIM solution, which gets customers connected in four clicks. I also work on backend reliability and scalability for the customer-facing platforms.</p>

          <h3>Swisscom</h3>
          <p>Senior Software Engineer for Data, Analytics &amp; AI · April 2024 – September 2024</p>
          <p>Kept working on internal self-service data platforms, data management, and secure delivery, so teams at Swisscom could find and use their data.</p>

          <h3>Swisscom</h3>
          <p>Software Engineer for Data, Analytics &amp; AI · August 2021 – March 2024</p>
          <p>Built and maintained full-stack self-service data applications and CI/CD pipelines. Helped introduce metadata and data-lineage tooling so teams could see what depended on their data. As Security Champion, kept the security docs up to date and automated code and dependency checks. Supported the team’s move to AWS.</p>

          <h3>AVINTIS SA</h3>
          <p>Software Engineer · December 2019 – August 2021</p>
          <p>Worked as a consultant for the Swiss government’s Federal Office of Information Technology, Systems and Telecommunication. Built tax-authority web applications with Java, Spring Boot, Angular, and Kafka, with unit, integration, and Selenium regression tests. Maintained Jenkins pipelines and Cloud Foundry deployments.</p>

          <h3>Advania Ísland</h3>
          <p>Software Developer / Software Engineer · November 2017 – December 2019</p>
          <p>Worked with Risk Management Solutions and teams in London and New York. Built C# and .NET integrations, SQL-backed APIs, and Azure delivery pipelines. Developed Django applications and Python data pipelines using AWS Lambda, S3, and API Gateway, alongside React frontend features.</p>

          <h3>Travelade</h3>
          <p>Software Developer · June 2017 – October 2017</p>
          <p>Built frontend features with React and Redux at an early-stage travel startup. Contributed product ideas, worked with AWS and Git, and improved search-engine visibility.</p>

          <h3>Rauðás Hugbúnaður ehf.</h3>
          <p>Web Developer · Part-time · October 2016 – June 2017</p>
          <p>Worked as a full-stack developer while studying, using Java, JavaScript, and MySQL. Created website themes and games, and set up TeamCity continuous integration and deployment for the company’s Git branches.</p>

          <h3>Bachelor’s Degree in Computer Science</h3>
          <p>Reykjavík University · June 2017</p>
          <p>Focused on web development and user interface design, with experience working independently and in teams.</p>

          <h3>AWS Cloud Practitioner</h3>
          <p>Certification · January 2023</p>
          <p>AWS Cloud concepts, AWS services, security, architecture and pricing.</p>

          <h3>Skills</h3>
          <p>C# / .NET, Java / Spring Boot, JavaScript / TypeScript, React / Next.js, Angular, HTML / CSS, Python / Django, SQL / PostgreSQL, Node.js / Express, AWS, Microsoft Azure, CI/CD / DevOps, Jenkins / TeamCity, Git, Docker / Kubernetes, Kafka.</p>
