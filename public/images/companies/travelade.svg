<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Travelade">
  <!-- Three overlapping leaf/petal shapes that form the Travelade map-pin mark -->
  <g fill="none" stroke="#111" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Pink (right / back) -->
    <path
      fill="#f45f8d"
      d="M36.5 14.5
         c8.2 1.8 13.2 9.2 12.2 17.4
         c-0.8 6.6-5.2 11.8-11.4 15.2
         c-1.6-4.8-4.6-9.8-9.2-14.2
         c4.2-6.2 7.2-13.2 8.4-18.4z"
    />
    <!-- Yellow (middle) -->
    <path
      fill="#f5c84a"
      d="M30.2 12.8
         c7.4 2.4 12.2 10.2 11.4 18.6
         c-0.7 7.2-5.4 13.2-12.4 17.6
         c-2.2-5.4-6.2-11.2-11.6-16.2
         c4.8-7.2 8.6-14.8 12.6-20z"
    />
    <!-- Green (left / front, forms the tip) -->
    <path
      fill="#2fd97a"
      d="M23.8 12.2
         c7.8 1.2 13.4 9.4 13.2 18.2
         c-0.2 8.6-5.6 15.8-13.8 21.2
         c-1.8 1.2-3.4 2.8-4.6 4.6
         c-0.4 0.6-1.3 0.4-1.4-0.3
         c-0.6-3.2 0.2-7.2 2.2-11.2
         C14.2 35.2 12 26.8 14.4 19.6
         c1.8-5.4 5.6-8.4 9.4-7.4z"
    />
  </g>
</svg>
