<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Travelade">
  <!--
    Travelade map-pin mark: three overlapping outlined petals
    (green / yellow / pink) forming a location pin.
  -->
  <g stroke="#111111" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round">
    <!-- Pink petal (right) -->
    <path
      fill="#f45f8d"
      d="M38.2 16.5
         C46.8 18.8 52.2 26.8 51.2 35.2
         C50.4 41.8 46.2 46.8 40.2 50.2
         C38.8 45.2 36.2 40.2 32.2 35.8
         C35.8 29.2 37.6 22.2 38.2 16.5Z"
    />
    <!-- Yellow petal (middle) -->
    <path
      fill="#f5c84a"
      d="M31.5 14.8
         C39.2 17.4 44.4 25.6 43.6 34.2
         C42.9 41.2 38.4 47.2 31.6 51.6
         C29.4 46.2 25.6 40.6 20.6 35.6
         C25.2 28.2 28.8 20.8 31.5 14.8Z"
    />
    <!-- Green petal (left, includes tip) -->
    <path
      fill="#2fd97a"
      d="M24.6 14.2
         C32.6 15.2 38.4 23.4 38.2 32.4
         C38 41.2 32.6 48.6 24.4 54.2
         C22.6 55.4 21 57 19.8 58.8
         C19.4 59.4 18.5 59.2 18.4 58.5
         C17.8 55.2 18.6 51.2 20.6 47.2
         C14.8 40.6 12.4 32.2 14.8 24.8
         C16.6 19.2 20.4 13.8 24.6 14.2Z"
    />
  </g>
</svg>
